name: Discord release message

# When a release is published, a message with the download link is posted to the Discord server.
# Needs the Actions secret DISCORD_WEBHOOK_URL (the Discord webhook address).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "For testing: announce a version again (e.g. v0.11.0). Empty = latest release."
        required: false

permissions:
  contents: read

jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send message to Discord
        run: node .github/discord-release.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          NEXUS_ICON_PATH: .github/logo.png
